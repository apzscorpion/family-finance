name: family_finance
description: "Family & Personal Finance Manager — track income, expenses, budgets and share with trusted family members."
publish_to: 'none'

version: 1.9.5+27

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local persistence
  path: ^1.9.0

  # Networking & Links
  http: ^1.2.2
  url_launcher: ^6.3.1

  # State & preferences
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  supabase_flutter: ^2.8.0

  # Utilities
  intl: ^0.20.2
  crypto: ^3.0.6
  uuid: ^4.5.1

  # Charts
  fl_chart: ^0.71.0

  # Reading .xlsx for the expense importer. Pure Dart, no native code, so it
  # adds no permissions and cannot affect installability.
  excel: ^4.0.6

  # Handing an exported CSV or Markdown file to another app. Uses the system
  # share sheet rather than writing into shared storage, so no storage
  # permission is needed.
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # Local reminders for card due dates and manually-paid recurring charges.
  # Scheduling is done in the device's own zone, so timezone ships with it.
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Prayer times. Pure Dart astronomy — no native code, no API key and no
  # network call, so times are computed offline and cost nothing at rest.
  adhan: ^2.0.0

  # One-shot coarse fix behind the optional "Use my location" button. Never
  # polled: the coordinates are resolved once and cached.
  geolocator: ^13.0.2

  # Bill capture hands off to the system camera app rather than embedding a
  # preview, so there is no CAMERA permission and no GPU preview pipeline.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    # The Nocturne design system specifies Inter at 400/500/600/700. Without
    # these bundled, `fontFamily: 'Inter'` silently fell back to Roboto and no
    # screen matched the design's type metrics.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700

    # The same Phosphor web font the design loads, so glyphs match exactly.
    # Used via lib/v3/phosphor_icons.dart rather than the phosphor_flutter
    # package, which no longer compiles (it extends the now-final IconData).
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
