name: family_finance
description: "Family & Personal Finance Manager — track income, expenses, budgets and share with trusted family members."
publish_to: 'none'

version: 1.5.0+15

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local persistence
  sqflite: ^2.4.1
  path: ^1.9.0

  # Networking & Links
  http: ^1.2.2
  url_launcher: ^6.3.1

  # State & preferences
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  supabase_flutter: ^2.8.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1

  # Charts
  fl_chart: ^0.71.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
